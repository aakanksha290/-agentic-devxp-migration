# REUSABLE WORKFLOW #2 - Build and push a container image.
# Uses the built-in GITHUB_TOKEN for GitHub Container Registry,
# so there are NO long-lived registry passwords (Jenkins used 'acr-creds').
name: Reusable - Docker build and push

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        required: true
      context:
        type: string
        default: "."
      push:
        type: boolean
        default: true
    outputs:
      image:
        description: Full image reference that was built
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  packages: write           # only what is needed to push the image

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out image tag
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$OWNER/${{ inputs.image-name }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.image }}
